name: Refresh fixed Easy Mandi APKs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-apks.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 33c05aeaaf8b48e509f349c65bbdf82bdad0d130
        run: |
          run_id=$(gh run list --repo Programmer-s-Picnic/easymandi --workflow android.yml --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -1)
          test -n "$run_id"
          gh run watch "$run_id" --repo Programmer-s-Picnic/easymandi --exit-status
          test "$(gh run view "$run_id" --repo Programmer-s-Picnic/easymandi --json headSha --jq .headSha)" = "$SOURCE_SHA"
          mkdir -p /tmp/easymandi-apks
          gh run download "$run_id" --repo Programmer-s-Picnic/easymandi --name easy-mandi-apk --dir /tmp/easymandi-apks
      - name: Replace binaries at established URLs and record checksums
        run: |
          test -s /tmp/easymandi-apks/app-arm64-v8a-release.apk
          test -s /tmp/easymandi-apks/app-armeabi-v7a-release.apk
          cp /tmp/easymandi-apks/app-arm64-v8a-release.apk releases/EasyMandi-64.apk
          cp /tmp/easymandi-apks/app-armeabi-v7a-release.apk releases/EasyMandi-32.apk
          cp releases/EasyMandi-64.apk releases/EasyMandi-arm64-v1.apk
          cp releases/EasyMandi-32.apk releases/EasyMandi-armeabi-v7a-v1.apk
          sha256sum releases/EasyMandi-64.apk releases/EasyMandi-32.apk > releases/SHA256SUMS
          printf '%s\n' '{"sourceCommit":"33c05aeaaf8b48e509f349c65bbdf82bdad0d130","version":"1.1.5+7","workflowRun":36823642221}' > releases/build.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/EasyMandi-64.apk releases/EasyMandi-32.apk releases/EasyMandi-arm64-v1.apk releases/EasyMandi-armeabi-v7a-v1.apk releases/SHA256SUMS releases/build.json
          git diff --cached --quiet || { git commit -m 'Publish notification layout APKs at existing paths'; git push; }
