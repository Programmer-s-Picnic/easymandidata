name: Refresh fixed Easy Mandi APKs
# Source build: 36682191344 (cart item removal, 1.1.2+4)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-apks.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest successful customer APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=36682191344
          gh run watch "$run_id" --repo Programmer-s-Picnic/easymandi --exit-status
          test -n "$run_id"
          mkdir -p /tmp/easymandi-apks
          gh run download "$run_id" --repo Programmer-s-Picnic/easymandi --name easy-mandi-apk --dir /tmp/easymandi-apks
      - name: Replace binaries at established URLs
        run: |
          test -s /tmp/easymandi-apks/app-arm64-v8a-release.apk
          test -s /tmp/easymandi-apks/app-armeabi-v7a-release.apk
          cp /tmp/easymandi-apks/app-arm64-v8a-release.apk releases/EasyMandi-64.apk
          cp /tmp/easymandi-apks/app-armeabi-v7a-release.apk releases/EasyMandi-32.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/EasyMandi-64.apk releases/EasyMandi-32.apk
          git diff --cached --quiet || { git commit -m 'Update Easy Mandi APKs at fixed URLs'; git push; }
