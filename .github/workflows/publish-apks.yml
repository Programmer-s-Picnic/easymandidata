name: Publish client APKs
on:
  push:
    paths:
      - 'release-parts/manifest.sha256'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify release APKs
        run: |
          mkdir -p releases
          cat release-parts/arm64/part-* > releases/EasyMandi-arm64-v1.apk
          cat release-parts/armv7/part-* > releases/EasyMandi-armeabi-v7a-v1.apk
          sha256sum -c release-parts/manifest.sha256
      - name: Publish verified APKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/EasyMandi-arm64-v1.apk releases/EasyMandi-armeabi-v7a-v1.apk
          git commit -m "Publish verified Easy Mandi client APKs"
          git push
